<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="480" fill="#f8f9fa" stroke="#dee2e6"/>

  <!-- Navbar -->
  <rect width="800" height="48" fill="#212529"/>
  <text x="20" y="30" fill="#fff" font-size="15" font-weight="bold">📚 Nhà sách</text>
  <text x="530" y="30" fill="#fff" font-size="13">Quy định</text>
  <text x="610" y="30" fill="#fff" font-size="13">Báo cáo</text>
  <text x="690" y="30" fill="#adb5bd" font-size="13">Đăng xuất</text>

  <!-- Tiêu đề -->
  <text x="30" y="88" font-size="20" font-weight="bold" fill="#212529">Quy định của hệ thống</text>

  <!-- Mô tả -->
  <text x="30" y="116" font-size="13" fill="#6c757d">Ba quy định dưới đây được lưu trong bảng quy_dinh. Mọi chức năng liên quan</text>
  <text x="30" y="136" font-size="13" fill="#6c757d">(lập phiếu nhập, đặt hàng, huỷ đơn quá hạn) đều đọc giá trị từ đây nên sửa xong là áp dụng ngay.</text>

  <!-- Card form -->
  <rect x="30" y="156" width="560" height="260" rx="8" fill="#fff" stroke="#dee2e6"/>

  <!-- Quy định 1 -->
  <text x="54" y="190" font-size="13" font-weight="bold" fill="#212529">nhap_toi_thieu</text>
  <text x="180" y="190" font-size="12" fill="#6c757d">(Số lượng nhập tối thiểu mỗi lần)</text>
  <rect x="54" y="198" width="512" height="36" rx="4" fill="#fff" stroke="#ced4da"/>
  <text x="66" y="221" font-size="14" fill="#495057" font-weight="bold">150</text>

  <!-- Quy định 2 -->
  <text x="54" y="258" font-size="13" font-weight="bold" fill="#212529">nguong_ton_de_nhap</text>
  <text x="220" y="258" font-size="12" fill="#6c757d">(Ngưỡng tồn kho để được phép nhập)</text>
  <rect x="54" y="266" width="512" height="36" rx="4" fill="#fff" stroke="#ced4da"/>
  <text x="66" y="289" font-size="14" fill="#495057" font-weight="bold">300</text>

  <!-- Quy định 3 -->
  <text x="54" y="326" font-size="13" font-weight="bold" fill="#212529">gio_huy_don</text>
  <text x="160" y="326" font-size="12" fill="#6c757d">(Giờ tự huỷ đơn trực tiếp quá hạn)</text>
  <rect x="54" y="334" width="512" height="36" rx="4" fill="#fff" stroke="#ced4da"/>
  <text x="66" y="357" font-size="14" fill="#495057" font-weight="bold">48</text>

  <!-- Nút Lưu -->
  <rect x="54" y="386" width="130" height="38" rx="4" fill="#0d6efd"/>
  <text x="119" y="410" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Lưu quy định</text>

  <!-- Ghi chú -->
  <text x="30" y="450" font-size="11" fill="#6c757d">• Giá trị phải là số nguyên không âm; nếu nhập chữ → hiện thông báo lỗi, không lưu.</text>

  <!-- Nhãn hình -->
  <text x="30" y="470" font-size="11" fill="#adb5bd">Hình 2.x — Màn quy định hệ thống (mockup)</text>
</svg>
