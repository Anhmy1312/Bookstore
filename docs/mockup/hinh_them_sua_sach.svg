<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" font-family="Segoe UI, Arial, sans-serif">
  <rect width="800" height="560" fill="#f8f9fa" stroke="#dee2e6"/>

  <!-- Navbar -->
  <rect width="800" height="48" fill="#212529"/>
  <text x="20" y="30" fill="#fff" font-size="15" font-weight="bold">📚 Nhà sách</text>
  <text x="500" y="30" fill="#fff" font-size="13">Quản lý sách</text>
  <text x="600" y="30" fill="#fff" font-size="13">Phiếu nhập</text>
  <text x="690" y="30" fill="#adb5bd" font-size="13">Đăng xuất</text>

  <!-- Tiêu đề -->
  <text x="160" y="90" font-size="20" font-weight="bold" fill="#212529">Thêm sách mới</text>

  <!-- Card form -->
  <rect x="140" y="108" width="520" height="400" rx="8" fill="#fff" stroke="#dee2e6"/>

  <!-- Tên sách -->
  <text x="164" y="142" font-size="13" font-weight="bold" fill="#212529">Tên sách</text>
  <rect x="164" y="150" width="472" height="36" rx="4" fill="#fff" stroke="#ced4da"/>
  <text x="176" y="173" font-size="13" fill="#adb5bd">Nhập tên sách...</text>

  <!-- Mã vạch + Tác giả -->
  <text x="164" y="212" font-size="13" font-weight="bold" fill="#212529">Mã vạch</text>
  <rect x="164" y="220" width="224" height="36" rx="4" fill="#fff" stroke="#ced4da"/>
  <text x="176" y="243" font-size="13" fill="#adb5bd">8935086...</text>

  <text x="412" y="212" font-size="13" font-weight="bold" fill="#212529">Tác giả</text>
  <rect x="412" y="220" width="224" height="36" rx="4" fill="#fff" stroke="#ced4da"/>
  <text x="424" y="243" font-size="13" fill="#adb5bd">Tên tác giả...</text>

  <!-- Thể loại + Đơn giá + Tồn -->
  <text x="164" y="282" font-size="13" font-weight="bold" fill="#212529">Thể loại</text>
  <rect x="164" y="290" width="224" height="36" rx="4" fill="#fff" stroke="#ced4da"/>
  <text x="176" y="313" font-size="13" fill="#6c757d">-- Chọn thể loại --</text>
  <polygon points="366,303 374,303 370,311" fill="#6c757d"/>

  <text x="412" y="282" font-size="13" font-weight="bold" fill="#212529">Đơn giá (VNĐ)</text>
  <rect x="412" y="290" width="140" height="36" rx="4" fill="#fff" stroke="#ced4da"/>
  <text x="424" y="313" font-size="13" fill="#adb5bd">0</text>

  <text x="572" y="282" font-size="13" font-weight="bold" fill="#212529">Số lượng tồn</text>
  <rect x="572" y="290" width="64" height="36" rx="4" fill="#fff" stroke="#ced4da"/>
  <text x="584" y="313" font-size="13" fill="#adb5bd">0</text>

  <!-- Chú thích tồn kho (khi sửa) -->
  <text x="164" y="352" font-size="11" fill="#6c757d" font-style="italic">※ Khi sửa sách: ô "Tồn kho hiện tại" bị khóa (chỉ đổi qua phiếu nhập/bán hàng)</text>

  <!-- Nút -->
  <rect x="164" y="440" width="120" height="38" rx="4" fill="#0d6efd"/>
  <text x="224" y="464" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Thêm sách</text>

  <rect x="296" y="440" width="80" height="38" rx="4" fill="#fff" stroke="#6c757d"/>
  <text x="336" y="464" text-anchor="middle" font-size="14" fill="#6c757d">Hủy</text>

  <!-- Nhãn hình -->
  <text x="30" y="546" font-size="11" fill="#adb5bd">Hình 2.x — Màn thêm/sửa sách (mockup)</text>
</svg>
