<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="620" fill="#f8f9fa" stroke="#dee2e6"/>

  <!-- Navbar -->
  <rect width="900" height="48" fill="#212529"/>
  <text x="20" y="30" fill="#fff" font-size="15" font-weight="bold">📚 Nhà sách</text>
  <text x="500" y="30" fill="#fff" font-size="13">Quản lý sách</text>
  <text x="600" y="30" fill="#fff" font-size="13">Phiếu nhập</text>
  <text x="690" y="30" fill="#adb5bd" font-size="13">Tài khoản</text>
  <text x="770" y="30" fill="#adb5bd" font-size="13">Đăng xuất</text>

  <!-- Tiêu đề -->
  <text x="30" y="88" font-size="20" font-weight="bold" fill="#212529">Lập phiếu nhập sách</text>

  <!-- Alert quy định -->
  <rect x="30" y="102" width="840" height="44" rx="4" fill="#cff4fc" stroke="#b6effb"/>
  <text x="44" y="122" font-size="12" fill="#087990">Quy định đang áp dụng: mỗi đầu sách nhập tối thiểu 150 cuốn,</text>
  <text x="44" y="140" font-size="12" fill="#087990">chỉ được nhập đầu sách có tồn kho &lt; 300 cuốn.</text>

  <!-- Card form -->
  <rect x="30" y="162" width="840" height="400" rx="8" fill="#fff" stroke="#dee2e6"/>

  <!-- Ngày nhập -->
  <text x="54" y="196" font-size="13" font-weight="bold" fill="#212529">Ngày nhập</text>
  <rect x="54" y="204" width="200" height="36" rx="4" fill="#fff" stroke="#ced4da"/>
  <text x="66" y="227" font-size="13" fill="#495057">2026-10-25</text>

  <!-- Tiêu đề bảng -->
  <text x="54" y="272" font-size="14" font-weight="bold" fill="#212529">Các dòng sách nhập</text>

  <!-- Bảng -->
  <rect x="54" y="284" width="792" height="230" fill="#fff" stroke="#dee2e6"/>

  <!-- Header -->
  <rect x="54" y="284" width="792" height="36" fill="#e9ecef"/>
  <text x="74" y="307" font-size="12" font-weight="bold" fill="#212529">STT</text>
  <text x="130" y="307" font-size="12" font-weight="bold" fill="#212529">Sách</text>
  <text x="620" y="307" font-size="12" font-weight="bold" fill="#212529">Số lượng</text>
  <text x="760" y="307" font-size="12" font-weight="bold" fill="#212529">Tồn hiện tại</text>

  <!-- Dòng 1 -->
  <line x1="54" y1="320" x2="846" y2="320" stroke="#dee2e6"/>
  <text x="74" y="344" font-size="12" fill="#495057">1</text>
  <rect x="130" y="328" width="470" height="30" rx="3" fill="#fff" stroke="#ced4da"/>
  <text x="142" y="348" font-size="12" fill="#6c757d">-- Chọn sách --</text>
  <polygon points="582,338 590,338 586,346" fill="#6c757d"/>
  <rect x="620" y="328" width="120" height="30" rx="3" fill="#fff" stroke="#ced4da"/>
  <text x="632" y="348" font-size="12" fill="#adb5bd">0</text>
  <text x="760" y="348" font-size="12" fill="#adb5bd">-</text>

  <!-- Dòng 2 -->
  <line x1="54" y1="364" x2="846" y2="364" stroke="#f0f0f0"/>
  <text x="74" y="388" font-size="12" fill="#495057">2</text>
  <rect x="130" y="372" width="470" height="30" rx="3" fill="#fff" stroke="#ced4da"/>
  <text x="142" y="392" font-size="12" fill="#6c757d">-- Chọn sách --</text>
  <polygon points="582,382 590,382 586,390" fill="#6c757d"/>
  <rect x="620" y="372" width="120" height="30" rx="3" fill="#fff" stroke="#ced4da"/>
  <text x="632" y="392" font-size="12" fill="#adb5bd">0</text>
  <text x="760" y="392" font-size="12" fill="#adb5bd">-</text>

  <!-- Dòng 3 -->
  <line x1="54" y1="408" x2="846" y2="408" stroke="#f0f0f0"/>
  <text x="74" y="432" font-size="12" fill="#495057">3</text>
  <rect x="130" y="416" width="470" height="30" rx="3" fill="#fff" stroke="#ced4da"/>
  <text x="142" y="436" font-size="12" fill="#6c757d">-- Chọn sách --</text>
  <polygon points="582,426 590,426 586,434" fill="#6c757d"/>
  <rect x="620" y="416" width="120" height="30" rx="3" fill="#fff" stroke="#ced4da"/>
  <text x="632" y="436" font-size="12" fill="#adb5bd">0</text>
  <text x="760" y="436" font-size="12" fill="#adb5bd">-</text>

  <!-- Dòng 4-6 (ẩn mô tả) -->
  <text x="450" y="478" text-anchor="middle" font-size="12" fill="#adb5bd">... (tổng 6 dòng nhập)</text>

  <!-- Nút -->
  <rect x="54" y="516" width="140" height="38" rx="4" fill="#0d6efd"/>
  <text x="124" y="540" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Lưu phiếu nhập</text>

  <rect x="206" y="516" width="170" height="38" rx="4" fill="#fff" stroke="#6c757d"/>
  <text x="291" y="540" text-anchor="middle" font-size="14" fill="#6c757d">Về danh sách sách</text>

  <!-- Ghi chú -->
  <text x="450" y="590" text-anchor="middle" font-size="11" fill="#6c757d">Mỗi dòng: chọn sách + nhập số lượng ≥ 150, tồn hiện tại phải &lt; 300</text>

  <!-- Nhãn hình -->
  <text x="30" y="610" font-size="11" fill="#adb5bd">Hình 2.x — Màn lập phiếu nhập (mockup)</text>
</svg>
