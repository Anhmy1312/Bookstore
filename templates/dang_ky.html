{% extends "base.html" %}
{% block title %}Đăng ký tài khoản{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h1 class="h4 mb-3">Đăng ký tài khoản khách hàng</h1>

    {% if loi %}
    <div class="alert alert-danger">{{ loi }}</div>
    {% endif %}

    <form method="post" class="card card-body">
      <div class="mb-3">
        <label class="form-label" for="ho_ten">Họ và tên</label>
        <input class="form-control" type="text" id="ho_ten" name="ho_ten" required
          value="{{ du_lieu.ho_ten }}">
      </div>
      <div class="mb-3">
        <label class="form-label" for="ten_dang_nhap">Tên đăng nhập</label>
        <input class="form-control" type="text" id="ten_dang_nhap" name="ten_dang_nhap" required
          value="{{ du_lieu.ten_dang_nhap }}">
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label" for="mat_khau">Mật khẩu</label>
          <input class="form-control" type="password" id="mat_khau" name="mat_khau" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label" for="xac_nhan_mat_khau">Xác nhận mật khẩu</label>
          <input class="form-control" type="password" id="xac_nhan_mat_khau" name="xac_nhan_mat_khau"
            required>
        </div>
      </div>
      <button class="btn btn-primary" type="submit">Đăng ký</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('auth.dang_nhap') }}">Đã có tài khoản? Đăng nhập</a>
    </form>
  </div>
</div>
{% endblock %}
